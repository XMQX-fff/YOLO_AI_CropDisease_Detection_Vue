<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统架构图 - 农作物病害检测系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1500px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 25px;
        }
        .svg-container {
            background: #ffffff;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow-x: auto;
        }
        svg {
            display: block;
            margin: 0 auto;
        }
        .layer-label {
            font-size: 14px;
            font-weight: bold;
            fill: #2c3e50;
        }
        .layer-sublabel {
            font-size: 11px;
            fill: #7f8c8d;
        }
        .node-rect {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .node-rect:hover {
            filter: brightness(1.1);
            stroke-width: 3;
        }
        .node-text {
            font-size: 12px;
            fill: #ffffff;
            text-anchor: middle;
            pointer-events: none;
            font-weight: 500;
        }
        .node-text-dark {
            font-size: 11px;
            fill: #2c3e50;
            text-anchor: middle;
            pointer-events: none;
        }
        .layer-bg {
            stroke: #bdc3c7;
            stroke-width: 2;
            fill: #ecf0f1;
        }
        .connection-line {
            stroke: #3498db;
            stroke-width: 1.5;
            stroke-dasharray: 5,5;
            opacity: 0.6;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: linear-gradient(145deg, #ffffff, #f8f9fa);
            border: 2px solid #3498db;
            border-radius: 16px;
            padding: 30px;
            max-width: 500px;
            color: #2c3e50;
            box-shadow: 0 10px 40px rgba(52, 152, 219, 0.3);
        }
        .modal-title {
            font-size: 20px;
            font-weight: bold;
            color: #2980b9;
            margin-bottom: 15px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .modal-desc {
            line-height: 1.8;
            color: #34495e;
        }
        .modal-close {
            margin-top: 20px;
            padding: 10px 30px;
            background: linear-gradient(145deg, #3498db, #2980b9);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .modal-close:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #2c3e50;
            font-size: 13px;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 1px solid #bdc3c7;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>系统架构图 - 农作物病害检测系统</h1>
        <div class="svg-container">
            <svg width="1450" height="950" xmlns="http://www.w3.org/2000/svg">
                <defs>

                        <stop offset="0%" style="stop-color:#3498db"/>
                        <stop offset="100%" style="stop-color:#2980b9"/>
                    </linearGradient>
                    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#9b59b6"/>
                        <stop offset="100%" style="stop-color:#8e44ad"/>
                    </linearGradient>
                    <linearGradient id="serviceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#27ae60"/>
                        <stop offset="100%" style="stop-color:#1e8449"/>
                    </linearGradient>
                    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#e74c3c"/>
                        <stop offset="100%" style="stop-color:#c0392b"/>

                        <stop offset="100%" style="stop-color:#d68910"/>
                    </linearGradient>

                        <stop offset="100%" style="stop-color:#16a085"/>
                    </linearGradient>
                    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
                        <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
                    </filter>
                </defs>

                <g id="layer-1">

                    <text class="layer-label" x="40" y="45" fill="#2c3e50">第一层：客户端层</text>
                    <text class="layer-sublabel" x="40" y="62" fill="#7f8c8d">Web前端 - Vue3 + Element Plus</text>
                    <g id="client-nodes" transform="translate(40, 80)">
                        <g class="node" data-name="首页" data-desc="系统首页，展示系统概览、快捷入口、通知公告等信息">
                            <rect class="node-rect" width="130" height="55" rx="8" fill="url(#clientGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="65" y="33">首页</text>
                        </g>
                        <g class="node" data-name="图片预测" data-desc="上传图片进行作物病害检测，支持多种YOLO模型选择，实时显示检测结果和置信度">
                            <rect class="node-rect" x="145" width="130" height="55" rx="8" fill="url(#clientGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="210" y="33">图片预测</text>
                        </g>
                        <g class="node" data-name="视频预测" data-desc="上传视频文件进行批量病害检测，支持实时进度显示和结果导出">
                            <rect class="node-rect" x="290" width="130" height="55" rx="8" fill="url(#clientGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="355" y="33">视频预测</text>
                        </g>
                        <g class="node" data-name="摄像头预测" data-desc="连接实时摄像头进行流式病害检测，支持WebSocket实时推送检测结果">
                            <rect class="node-rect" x="435" width="130" height="55" rx="8" fill="url(#clientGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="500" y="33">摄像头预测</text>
                        </g>
                        <g class="node" data-name="图片记录" data-desc="查看历史图片检测记录，包含检测时间、图像、结果等信息，支持导出">
                            <rect class="node-rect" x="580" width="130" height="55" rx="8" fill="url(#clientGrad)" filter="url(#shadow)"/>

                        <g class="node" data-name="视频记录" data-desc="查看历史视频检测记录，包含视频文件、检测结果、置信度统计">
                            <rect class="node-rect" x="725" width="130" height="55" rx="8" fill="url(#clientGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="790" y="33">视频记录</text>
                        </g>
                        <g class="node" data-name="摄像头记录" data-desc="查看历史摄像头检测记录，包含实时抓图、告警记录">

                            <text class="node-text" x="935" y="33">摄像头记录</text>
                        </g>
                        <g class="node" data-name="数据大屏" data-desc="数据可视化大屏，展示检测统计、病害趋势、设备状态等信息">
                            <rect class="node-rect" x="1015" width="130" height="55" rx="8" fill="url(#clientGrad)" filter="url(#shadow)"/>

                        <g class="node" data-name="温室管理" data-desc="温室大棚信息管理，包含环境监测、设备控制、告警配置">
                            <rect class="node-rect" y="70" width="130" height="55" rx="8" fill="url(#clientGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="65" y="103">温室管理</text>
                        </g>
                        <g class="node" data-name="病害知识" data-desc="作物病害知识库，包含病害类型、症状、防治方案">
                            <rect class="node-rect" x="145" y="70" width="130" height="55" rx="8" fill="url(#clientGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="210" y="103">病害知识</text>

                        <g class="node" data-name="采购管理" data-desc="农业生产资料采购管理，包含供应商、订单、物流跟踪">
                            <rect class="node-rect" x="290" y="70" width="130" height="55" rx="8" fill="url(#clientGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="355" y="103">采购管理</text>
                        </g>
                        <g class="node" data-name="仓储管理" data-desc="农产品仓储管理，库存记录、出入库管理">
                            <rect class="node-rect" x="435" y="70" width="130" height="55" rx="8" fill="url(#clientGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="500" y="103">仓储管理</text>
                        </g>
                        <g class="node" data-name="用户管理" data-desc="系统用户管理，角色权限分配、用户信息维护">
                            <rect class="node-rect" x="580" y="70" width="130" height="55" rx="8" fill="url(#clientGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="645" y="103">用户管理</text>
                        </g>
                        <g class="node" data-name="个人中心" data-desc="个人账户信息修改、密码修改、登录日志查看">
                            <rect class="node-rect" x="725" y="70" width="130" height="55" rx="8" fill="url(#clientGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="790" y="103">个人中心</text>
                        </g>
                    </g>
                </g>

                <g id="layer-2">
                    <rect class="layer-bg" x="20" y="245" width="1410" height="80" rx="12" fill="#e8d5f2"/>
                    <text class="layer-label" x="40" y="270" fill="#2c3e50">第二层：网关层</text>

                    <g id="gateway-nodes" transform="translate(200, 280)">
                        <g class="node" data-name="API网关" data-desc="统一API入口，负责请求路由、协议转换、限流熔断">
                            <rect class="node-rect" width="180" height="35" rx="8" fill="url(#gatewayGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="90" y="24">API 网关</text>
                        </g>
                        <g class="node" data-name="认证中心" data-desc="统一身份认证服务，处理JWT令牌、OAuth2授权">
                            <rect class="node-rect" x="220" width="160" height="35" rx="8" fill="url(#gatewayGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="300" y="24">认证中心</text>
                        </g>
                    </g>
                </g>

                <g id="layer-3">

                    <g id="service-nodes" transform="translate(40, 395)">
                        <g class="node" data-name="用户服务" data-desc="用户管理服务 - UserController，处理用户注册、登录、信息修改、角色权限管理">
                            <rect class="node-rect" width="140" height="55" rx="8" fill="url(#serviceGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="70" y="33">用户服务</text>
                        </g>
                        <g class="node" data-name="商品服务" data-desc="商品信息管理 - ProductController，维护农产品、病害防治物资信息">
                            <rect class="node-rect" x="155" width="140" height="55" rx="8" fill="url(#serviceGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="225" y="33">商品服务</text>
                        </g>
                        <g class="node" data-name="订单服务" data-desc="订单管理 - OrderController/OrderItemController，订单创建、查询、取消">
                            <rect class="node-rect" x="310" width="140" height="55" rx="8" fill="url(#serviceGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="380" y="33">订单服务</text>
                        </g>
                        <g class="node" data-name="支付服务" data-desc="支付服务 - PaymentRecordController/PaymentMethodController，支付记录和支付方式管理">
                            <rect class="node-rect" x="465" width="140" height="55" rx="8" fill="url(#serviceGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="535" y="33">支付服务</text>
                        </g>
                        <g class="node" data-name="物流服务" data-desc="物流配送 - LogisticsController，物流信息追踪和管理">
                            <rect class="node-rect" x="620" width="140" height="55" rx="8" fill="url(#serviceGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="690" y="33">物流服务</text>
                        </g>
                        <g class="node" data-name="采购服务" data-desc="采购管理 - PurchaseController，采购订单、供应商管理">
                            <rect class="node-rect" x="775" width="140" height="55" rx="8" fill="url(#serviceGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="845" y="33">采购服务</text>
                        </g>
                        <g class="node" data-name="仓储服务" data-desc="存储管理 - StorageController，库存记录、出入库管理">
                            <rect class="node-rect" x="930" width="140" height="55" rx="8" fill="url(#serviceGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="1000" y="33">仓储服务</text>
                        </g>
                        <g class="node" data-name="统计服务" data-desc="数据统计 - StatisticsController，检测统计、趋势分析、报表生成">
                            <rect class="node-rect" width="140" height="55" rx="8" y="70" fill="url(#serviceGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="70" y="103">统计服务</text>
                        </g>
                        <g class="node" data-name="温室服务" data-desc="温室管理 - GreenhouseController，温室大棚信息、环境监测">
                            <rect class="node-rect" x="155" width="140" height="55" rx="8" y="70" fill="url(#serviceGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="225" y="103">温室服务</text>
                        </g>
                        <g class="node" data-name="温室告警" data-desc="告警管理 - GreenhouseAlertRuleController/AlertHistory，告警规则和历史记录">
                            <rect class="node-rect" x="310" width="140" height="55" rx="8" y="70" fill="url(#serviceGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="380" y="103">温室告警</text>
                        </g>
                        <g class="node" data-name="温室设备" data-desc="设备管理 - GreenhouseDeviceController，温室设备监控和控制">
                            <rect class="node-rect" x="465" width="140" height="55" rx="8" y="70" fill="url(#serviceGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="535" y="103">温室设备</text>
                        </g>
                        <g class="node" data-name="温室环境" data-desc="环境历史 - GreenhouseEnvironmentHistoryController，温室环境数据历史记录">

                            <text class="node-text" x="690" y="103">温室环境</text>
                        </g>
                        <g class="node" data-name="检测服务" data-desc="检测管理 - GreenhouseDetectionController/PestDetectionController，病虫害检测记录">

                            <text class="node-text" x="845" y="103">检测服务</text>

                        <g class="node" data-name="病害服务" data-desc="病害知识 - DiseaseController，病害类型、症状、防治方案管理">

                            <text class="node-text" x="535" y="173">摄像头记录</text>
                        </g>
                        <g class="node" data-name="文件服务" data-desc="文件管理 - FileController，图片/视频文件上传、存储">
                            <rect class="node-rect" x="620" width="140" height="55" rx="8" y="140" fill="url(#serviceGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="690" y="173">文件服务</text>
                        </g>
                        <g class="node" data-name="AI推理服务" data-desc="YOLO深度学习模型推理服务 - Flask + SocketIO，图片/视频/摄像头实时病害检测，支持WebSocket实时推送">

                </g>

                <g id="layer-4">
                    <rect class="layer-bg" x="20" y="655" width="1410" height="130" rx="12" fill="#fbf3dc"/>
                    <text class="layer-label" x="40" y="680" fill="#2c3e50">第四层：数据层</text>
                    <text class="layer-sublabel" x="40" y="697" fill="#7f8c8d">数据持久化 · 缓存 · 文件存储</text>
                    <g id="data-nodes" transform="translate(40, 710)">
                        <g class="node" data-name="MySQL数据库" data-desc="主业务数据库 - MySQL/MariaDB，存储用户、订单、商品、检测记录等核心业务数据，使用MyBatis-Plus ORM">
                            <rect class="node-rect" width="160" height="60" rx="8" fill="url(#dataGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="80" y="30">MySQL</text>
                            <text class="node-text" x="80" y="45" font-size="9" fill="#7d6608">业务数据库</text>
                        </g>
                        <g class="node" data-name="Redis缓存" data-desc="高性能分布式缓存 - Redis，存储会话信息、热点数据、限流计数器">
                            <rect class="node-rect" x="180" width="160" height="60" rx="8" fill="url(#dataGrad)" filter="url(#shadow)"/>
                            <text class="node-text" x="260" y="30">Redis</text>
                            <text class="node-text" x="260" y="45" font-size="9" fill="#7d6608">分布式缓存</text>
                        </g>
                        <g class="node" data-name="对象存储" data-desc="海量文件存储 - MinIO/OSS，存储检测图片、视频文件、模型权重文件">

    <div id="modal" class="modal">
        <div class="modal-content">
            <div id="modal-title" class="modal-title"></div>
            <div id="modal-desc" class="modal-desc"></div>
            <button class="modal-close" onclick="closeModal()">关闭</button>
        </div>
    </div>

    <script>
        document.querySelectorAll('.node').forEach(node => {
            node.addEventListener('click', function() {
                const name = this.getAttribute('data-name');
                const desc = this.getAttribute('data-desc');
                showModal(name, desc);
            });
        });

        function showModal(title, desc) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').textContent = desc;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
    </script>
